name: Deploy landing page to GitHub Pages
# Static only: no backend is deployed. The console needs a local gateway and is not published.
on:
  push:
    branches: [master]
    paths:
      - "Landing page and dashboard implementation/**"
      - "bench/results.json"
      - ".github/workflows/pages.yml"
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Assemble static site
        run: |
          mkdir -p _site
          cp -r "Landing page and dashboard implementation/." _site/
          rm -rf _site/replay
          mkdir -p _site/bench && cp bench/results.json _site/bench/results.json
          cp "_site/Trishul-Landing.dc.html" _site/index.html
          touch _site/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
