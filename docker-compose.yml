# Gateway (REST/WS :8787 + MCP :8788), the tool servers (separate `tools` service, HTTP on an
# internal-only network) and the console UI (served by the gateway at /console).
# Models run natively on the Mac; the container reaches Ollama via host.docker.internal:11434.
#
# SECURITY
# * Agents/operators only ever reach the gateway. The tool servers live on the `tools` network
#   (`internal: true`: no route to or from the host, no published ports) and additionally refuse
#   any call without a gateway-signed, single-use token (trishul/crypto/toolauth.py).
# * Gateway ports are published to the HOST loopback only (127.0.0.1:PORT:PORT). Do not change these
#   to "8787:8787" / 0.0.0.0. For a public red-team wall use a separate tunnel in front of a dedicated
#   read/submit-only proxy, not this port mapping.
# * Private signing keys sit in their own volume (`trishul-keys`) mounted by the gateway ONLY. The
#   tools service mounts `trishul-data` (SQLite + exported public keys) and never sees a private key.
#   Residual risk: anything that can write `trishul-data` bypasses the tool-level checks.
services:
  gateway:
    build: .
    image: trishul-gateway:local
    networks: [edge, tools]
    ports:
      - "127.0.0.1:8787:8787"
      - "127.0.0.1:8788:8788"
    volumes:
      - trishul-data:/data
      - trishul-keys:/keys
    environment:
      TRISHUL_DB: /data/trishul.db
      TRISHUL_HOME: /keys
      TRISHUL_PUBLIC_KEYS_DIR: /data/public-keys
      TRISHUL_TOOLS_URL: http://tools:9000
      OLLAMA_HOST: http://host.docker.internal:11434
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - tools
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://127.0.0.1:8787/healthz', timeout=3)"]
      interval: 10s
      timeout: 4s
      retries: 5
      start_period: 20s
    restart: unless-stopped
  tools:
    build: .
    image: trishul-gateway:local
    networks: [tools]
    # no `ports:` on purpose. The service waits for the gateway's public keys, then serves
    # upi/crm/mail/files on :9001-:9004 bound to its own address on the internal network.
    command:
      - python
      - -m
      - trishul.gateway.tools_supervisor
      - --db
      - /data/trishul.db
      - --keys
      - /data/public-keys
      - --host
      - tools
      - --port
      - "9000"
    environment:
      TRISHUL_CLOCK: live  # ledger timestamps follow the gateway's wall clock (trishul start)
    volumes:
      - trishul-data:/data
    restart: unless-stopped
networks:
  edge: {}
  tools:
    internal: true
volumes:
  trishul-data:
  trishul-keys:
