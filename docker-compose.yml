# Gateway (REST/WS :8787 + MCP :8788), stdio tool servers (spawned inside the gateway container),
# SQLite volume, and the console UI (served by the gateway at /console).
# Models run natively on the Mac; the container reaches Ollama via host.docker.internal:11434.
#
# SECURITY: operator routes are loopback-restricted only when TRISHUL_REDTEAM_PUBLIC=1. Inside
# Docker every client arrives from the bridge gateway (not loopback), so we never rely on that
# check here: ports are published to the HOST loopback only (127.0.0.1:PORT:PORT). Do not
# change these to "8787:8787" / 0.0.0.0. For a public red-team wall use a separate tunnel in
# front of a dedicated read/submit-only proxy, not this port mapping.
services:
  gateway:
    build: .
    image: trishul-gateway:local
    ports:
      - "127.0.0.1:8787:8787"
      - "127.0.0.1:8788:8788"
    volumes:
      - trishul-data:/data
    environment:
      TRISHUL_DB: /data/trishul.db
      OLLAMA_HOST: http://host.docker.internal:11434
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://127.0.0.1:8787/healthz', timeout=3)"]
      interval: 10s
      timeout: 4s
      retries: 5
      start_period: 20s
    restart: unless-stopped
volumes:
  trishul-data:
