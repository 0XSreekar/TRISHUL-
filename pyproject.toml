[project]
name = "trishul"
version = "0.1.0"
description = "TRISHUL Phase 1 foundation: contracts, provenance, policy compiler and evaluator"
requires-python = ">=3.12,<3.13"
dependencies = [
    "cryptography>=43",
    "fastmcp>=4.0.10,<5",
    "numpy>=2",
    "opentelemetry-sdk>=1.45",
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "starlette>=0.40",
    "uvicorn>=0.30",
    "websockets>=13",
    "z3-solver>=4.13",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "hypothesis>=6.100",
    "mypy>=1.10",
    "ruff>=0.5",
    "types-PyYAML",
]
mcp = ["fastmcp>=2.9"]
voice = [
    "mlx-whisper>=0.4",
]
voice-ml = [
    "torch",
    "transformers",
    "huggingface_hub",
    "soundfile",
    "einops",
    "faster-whisper",
]

[project.scripts]
trishul = "trishul.cli.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["trishul"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "B", "UP", "I", "S", "C4", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "S311"]

[tool.mypy]
strict = true
python_version = "3.12"
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "voice_models: needs real voice models in the local HF cache; auto-skipped when absent",
]
